services:
  auth-service:
    build:
      context: ./auth-service
    container_name: skillsync-auth
    ports:
      - "8001:8001"
    env_file:
      - ./auth-service/.env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8001
      --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  profile-service:
    build:
      context: ./profile-service
    container_name: skillsync-profile
    ports:
      - "8002:8002"
    env_file:
      - ./profile-service/.env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8002
      --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jobs-service:
    build:
      context: ./jobs-service
    container_name: skillsync-jobs
    ports:
      - "8003:8003"
    env_file:
      - ./jobs-service/.env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8003
      --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  career-ai-service:
    build:
      context: ./career-ai-service
    container_name: skillsync-career-ai
    ports:
      - "8004:8004"
    env_file:
      - ./career-ai-service/.env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8004
      --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: skillsync-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./api-gateway/.env
    depends_on:
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      jobs-service:
        condition: service_healthy
      career-ai-service:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: skillsync-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped